DatabaseConsistencyCheckers:
  # App-layer numericality validators are intentional; mirroring every bound
  # into Postgres CHECK constraints is out of scope for now.
  NumericalityConstraintChecker:
    enabled: false

# Ignore false positive from Rails' ActionText and ActiveStorage
ActionText::RichText:
  enabled: false
ActiveStorage::Attachment:
  enabled: false
ActiveStorage::Blob:
  enabled: false
ActiveStorage::VariantRecord:
  enabled: false
