name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  LOCATION_LAT: 44.0000
  LOCATION_LON: -88.0000
  LOCATION_ELEVATION_FT: 0

jobs:
  scan_ruby:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        id: brakeman
        continue-on-error: true
        run: |
          set -o pipefail
          bin/brakeman --no-pager 2>&1 | tee brakeman-output.txt

      - name: Scan for known security vulnerabilities in gems used
        id: bundler_audit
        continue-on-error: true
        run: |
          set -o pipefail
          bin/bundler-audit 2>&1 | tee bundler-audit-output.txt

      - name: Build PR comment body
        if: github.event_name == 'pull_request'
        id: comment
        env:
          BRAKEMAN_OUTCOME: ${{ steps.brakeman.outcome }}
          BUNDLER_AUDIT_OUTCOME: ${{ steps.bundler_audit.outcome }}
        run: |
          has_findings=false
          {
            echo "## Ruby security scan"
            echo
            echo "These checks no longer fail CI. Address findings below when practical (e.g. gem updates from bundler-audit)."
            echo

            if [ "$BRAKEMAN_OUTCOME" = "failure" ]; then
              has_findings=true
              echo "### Brakeman"
              echo
              echo '```'
              # Keep comment under GitHub's size limit.
              head -c 20000 brakeman-output.txt || true
              echo
              echo '```'
              echo
            else
              echo "### Brakeman"
              echo
              echo "No issues found."
              echo
            fi

            if [ "$BUNDLER_AUDIT_OUTCOME" = "failure" ]; then
              has_findings=true
              echo "### Bundler audit"
              echo
              echo '```'
              head -c 20000 bundler-audit-output.txt || true
              echo
              echo '```'
              echo
            else
              echo "### Bundler audit"
              echo
              echo "No vulnerable gems found."
              echo
            fi
          } > comment-body.md

          if [ "$has_findings" = "true" ]; then
            echo "has_findings=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_findings=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment scan findings on PR
        if: github.event_name == 'pull_request' && steps.comment.outputs.has_findings == 'true'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: scan-ruby
          path: comment-body.md

      - name: Remove stale scan comment when clean
        if: github.event_name == 'pull_request' && steps.comment.outputs.has_findings == 'false'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: scan-ruby
          delete: true

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev node-gyp

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare database
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
        run: bin/rails db:test:prepare

      - name: Check database/model consistency
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
        run: bin/database_consistency

      - name: Run JavaScript unit tests
        run: yarn test:js

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails test

  system-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev node-gyp

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Build frontend assets
        run: yarn build && yarn build:css

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run System Tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
