# Friendly names for auxiliary sensor groupings (soil moisture, temp probes,
# wireless temp/humidity). Unnamed channels fall back to "Ch N" (soil),
# "Temp Ch N" (temp probes), or "TH Ch N" (temp/humidity).
#
# Each key is the single display name for a grouping. Groups may declare:
#   soil: <channel 1–8>           # moisture sensor channel
#   temp_probe: <channel 1–8>     # temperature probe channel
#   temp_humidity: <channel 1–8>  # wireless temp/humidity channel
# Any key may be omitted; channels that share a name merge into one card row.
#
# Example — humidity on soil ch 1 + temp probe ch 2 share one row:
# Front Yard:
#   soil: 1
#   temp_probe: 2

Veggie Bed:
  soil: 1

Front Yard:
  soil: 2
  temp_probe: 2

Back Yard:
  soil: 3
  temp_probe: 1
