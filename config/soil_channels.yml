# Friendly names for soil moisture / temperature probe groupings.
# Unnamed channels fall back to "Ch N" (soil) or "Temp Ch N" (temp probes).
#
# Each key is the single display name for a grouping. Groups may declare:
#   soil: <channel 1–8>         # moisture sensor channel
#   temp_probe: <channel 1–8>   # temperature probe channel
# Either key may be omitted for moisture-only or temp-only rows.
#
# Example — humidity on soil ch 1 + temp probe ch 2 share one Soil card row:
# Front Yard:
#   soil: 1
#   temp_probe: 2

Veggie Bed:
  soil: 1

Front Bed 1:
  soil: 2

Back Bed 1:
  soil: 3
