# Friendly names for soil moisture/temperature channels (1–8).
# Unnamed channels fall back to "Ch N" in the UI.
#
# Channels that share the same friendly name are merged into one Soil
# table row (useful when one sensor reports humidity and another
# reports temperature for the same location).
#
# Example:
# 1: Raised bed
# 2: Tomato pots
# 4: Greenhouse
# 5: Greenhouse
1: Veggie Bed
2: Front Bed 1
3: Back Bed 1
